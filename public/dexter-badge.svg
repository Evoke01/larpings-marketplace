<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">DEXTER badge</title>
  <desc id="desc">DEXTER's original black-and-white avatar in a circular badge mark.</desc>
  <defs>
    <clipPath id="avatar-clip"><circle cx="50" cy="50" r="47" /></clipPath>
    <filter id="portrait-contrast">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.15" intercept="-.03" />
        <feFuncG type="linear" slope="1.15" intercept="-.03" />
        <feFuncB type="linear" slope="1.15" intercept="-.03" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100" height="100" rx="50" fill="#09090b" />
  <image href="/dexter-badge.png" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" filter="url(#portrait-contrast)" />
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ff2323" stroke-opacity=".4" stroke-width="2" />
</svg>

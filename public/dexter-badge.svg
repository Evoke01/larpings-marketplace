<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title">
  <title>DEXTER badge</title>
  <defs>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0d0d10" stroke="#ff0000" stroke-opacity=".45" />
  <image href="/dexter-badge.png" x="4" y="4" width="92" height="92" preserveAspectRatio="xMidYMid slice" filter="url(#soft-glow)" />
</svg>
